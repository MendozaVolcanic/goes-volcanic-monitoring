name: Hi-res visible cache build

# Pre-procesa banda visible desde NOAA L1b para los 8 volcanes prioritarios
# y publica como release rolling `hires-rolling`. mode color = TrueColor
# PAN-SHARPENED a 0.5 km/px (color de bandas 1+2+3 a 1 km + detalle de banda
# 2 nativa 0.5 km via High-Pass Modulation) = 4× RAMMB.
#
# Day/night switch automatico:
#   - Sun >= 5° elevacion: TrueColor RGB visible pan-sharpened (0.5 km/px)
#   - Sun < 5°:           Pseudo-color desde banda 13 IR window (2 km)
#
# Ver src/process/hires_pipeline.py para la receta.

on:
  schedule:
    # Cada 10 min (cadencia NATIVA de GOES-19 RadF) -> loops hi-res tan fluidos
    # como RAMMB. Antes 30 min; subido a 10 a pedido OVDAS (jun 2026). El still
    # (snapshot) tambien se refresca; comparte la descarga de bandas con el loop.
    - cron: '*/10 * * * *'
    # Cada 60 min en :22 (offset distinto), modo mono_05km (4× zoom real),
    # solo durante horario diurno sobre Chile (UTC 11-23 cubre amanecer
    # hasta atardecer). Un solo trigger usa el cron de arriba; el modo
    # se elige via input por defecto en jobs.* (color).
  workflow_dispatch:
    inputs:
      mode:
        description: "Modo: 'color' (TrueColor + IR night) o 'mono_05km' (4× zoom real, solo dia)"
        required: false
        default: 'color'
        type: choice
        options: ['color', 'mono_05km']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias
        run: pip install -r requirements_actions.txt

      - name: Build cache hi-res
        run: |
          # workflow_dispatch puede pasar mode especifico (color o mono_05km).
          # En schedule (sin input) corremos AMBOS modos para mantener los
          # 2 caches frescos: color (TrueColor + IR) Y mono (0.5km/px sepia).
          # El segundo run usa --no-clean para preservar los PNGs del primero.
          INPUT_MODE="${{ inputs.mode }}"
          if [ -z "$INPUT_MODE" ]; then
            echo "Schedule run: building BOTH modes"
            python scripts/build_hires_cache.py --mode color
            python scripts/build_hires_cache.py --mode mono_05km --no-clean
          else
            echo "Manual run: building mode=$INPUT_MODE"
            python scripts/build_hires_cache.py --mode "$INPUT_MODE"
          fi

      - name: Build loop cache rolling (0.5km hi-res)
        # Ventana RODANTE ~8h de frames 0.5km para LOOPS hi-res. Incremental:
        # baja el ZIP rodante existente del release, agrega SOLO el frame del
        # scan actual (reusa las bandas L1b ya bajadas por el paso anterior),
        # poda lo > 8h. En ~8h se llena (~16 frames a 30 min).
        run: python scripts/build_hires_loop_cache.py

      - name: Listar contenido
        run: |
          ls -lh out_hires/ | head -15
          echo "--- loop cache ---"
          ls -lh out_hires_loop/ 2>/dev/null | head -12
          echo "Total assets hires: $(ls out_hires/ | wc -l)"

      - name: Publicar al release rolling
        uses: ./.github/actions/gh-release-snapshot
        with:
          tag: hires-rolling
          title: "Hi-res visible cache (rolling)"
          notes: "Cache rolling de imagenes visibles 0.5 km/px (pan-sharpened) para los 8 volcanes prioritarios. Actualizado por hires_visible_cache.yml cada 30 min. Day = TrueColor pan-sharp, Night = IR pseudo-color."
          dir: out_hires
          prerelease: 'true'
          batch-size: '50'
          sleep-between-batches: '15'

      - name: Publicar loop cache (0.5km rolling)
        # Release separado para la ventana rodante de loops hi-res. dir distinto.
        if: ${{ hashFiles('out_hires_loop/**') != '' }}
        uses: ./.github/actions/gh-release-snapshot
        with:
          tag: hires-loop-rolling
          title: "Hi-res loop cache (rolling 0.5km)"
          notes: "Ventana rodante ~8h de frames GeoColor 0.5km pan-sharpened para los 8 volcanes prioritarios. Permite LOOPS hi-res en la vista loops (modo volcan). Actualizado cada ~30 min; se llena en ~8h."
          dir: out_hires_loop
          prerelease: 'true'
          batch-size: '50'
          sleep-between-batches: '15'
