name: Hi-res visible cache build

# Pre-procesa banda visible 0.5 km/px desde NOAA L1b para los 8 volcanes
# prioritarios y publica como release rolling `hires-rolling`. Resolucion
# efectiva ~1 km/px (banda 2 downsampleada para alinear con bandas 1+3).
#
# Day/night switch automatico:
#   - Sun >= 5° elevacion: TrueColor RGB visible
#   - Sun < 5°:           Pseudo-color desde banda 13 IR window
#
# Ver src/process/hires_pipeline.py para la receta.

on:
  schedule:
    # Cada 30 min en :17 y :47 (offset para no chocar con animation_cache :07).
    # Default = color (TrueColor day + IR night).
    - cron: '17,47 * * * *'
    # Cada 60 min en :22 (offset distinto), modo mono_05km (4× zoom real),
    # solo durante horario diurno sobre Chile (UTC 11-23 cubre amanecer
    # hasta atardecer). Un solo trigger usa el cron de arriba; el modo
    # se elige via input por defecto en jobs.* (color).
  workflow_dispatch:
    inputs:
      mode:
        description: "Modo: 'color' (TrueColor + IR night) o 'mono_05km' (4× zoom real, solo dia)"
        required: false
        default: 'color'
        type: choice
        options: ['color', 'mono_05km']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias
        run: pip install -r requirements_actions.txt

      - name: Build cache hi-res
        run: |
          MODE="${{ inputs.mode || 'color' }}"
          echo "Building hi-res mode=$MODE"
          python scripts/build_hires_cache.py --mode "$MODE"

      - name: Listar contenido
        run: |
          ls -lh out_hires/ | head -15
          echo "---"
          echo "Total assets: $(ls out_hires/ | wc -l)"
          echo "Total size: $(du -sh out_hires/ | cut -f1)"

      - name: Publicar al release rolling
        uses: ./.github/actions/gh-release-snapshot
        with:
          tag: hires-rolling
          title: "Hi-res visible cache (rolling)"
          notes: "Cache rolling de imagenes visibles 1 km/px para los 8 volcanes prioritarios. Actualizado por hires_visible_cache.yml cada 30 min. Day = TrueColor, Night = IR pseudo-color."
          dir: out_hires
          prerelease: 'true'
          batch-size: '50'
          sleep-between-batches: '15'
