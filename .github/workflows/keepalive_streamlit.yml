name: Keepalive Streamlit Cloud

# Streamlit Cloud free tier duerme apps sin trafico ~12h. Despues entran
# en estado dormant: el endpoint sirve un shell HTML + 303 redirect a
# share.streamlit.io/-/auth/app. Un curl/GET NO despierta la app — solo
# baja el shell estatico. Hace falta un browser real con JS + WebSocket
# que pulse el boton "Yes, get this app back up!".
#
# Este workflow corre Playwright headless cada 8h, visita la URL, espera
# que cargue (max 90s), y si ve el boton de wake-up lo clickea. Mantiene
# la app despierta sin costo (~30 GH Actions minutos/mes).
#
# Fuentes:
#   https://dev.to/yasumorishima/http-200-but-your-streamlit-app-is-still-sleeping-...
#   https://discuss.streamlit.io/t/wake-up-streamlit-apps/75987

on:
  schedule:
    # Cada 8h en :11 (offset para no chocar con otros workflows)
    - cron: '11 */8 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Visit + wake app si dormant
        env:
          APP_URL: https://goesvolcanic.streamlit.app/
        run: |
          python - <<'PYEOF'
          import os
          import time
          from playwright.sync_api import sync_playwright

          url = os.environ["APP_URL"]
          print(f"Pinging {url} ...")

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              ctx = browser.new_context(
                  user_agent="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 "
                             "(KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36",
              )
              page = ctx.new_page()
              page.goto(url, wait_until="domcontentloaded", timeout=60_000)

              # Si la app esta dormant, hay un boton "Yes, get this app back up!"
              # (texto exacto cambia segun version de Streamlit Cloud).
              # Intentamos varios selectores conocidos.
              wake_button_selectors = [
                  'button:has-text("Yes, get this app back up")',
                  'button:has-text("get this app back up")',
                  'button:has-text("Wake")',
                  '[data-testid="stWakeUpButton"]',
              ]
              clicked = False
              for sel in wake_button_selectors:
                  try:
                      btn = page.locator(sel).first
                      if btn.is_visible(timeout=2000):
                          print(f"Found wake button: {sel}")
                          btn.click()
                          clicked = True
                          break
                  except Exception:
                      continue

              if clicked:
                  print("Clicked wake button. Esperando que la app levante...")
                  # Esperar hasta que aparezca contenido del dashboard
                  # (el sidebar tiene texto "GOES Monitor")
                  try:
                      page.wait_for_selector('text=GOES Monitor', timeout=90_000)
                      print("OK app despierta y renderea.")
                  except Exception:
                      print("WARN: la app no termino de levantar en 90s.")
              else:
                  print("No wake button visible — app probablemente ya esta despierta.")
                  # Verificar que el sidebar esta presente igualmente
                  try:
                      page.wait_for_selector('text=GOES Monitor', timeout=30_000)
                      print("OK app responde con UI normal.")
                  except Exception:
                      print("WARN: no veo el sidebar 'GOES Monitor' — app puede tener un error.")

              # Tomar screenshot para debugging
              page.screenshot(path="keepalive_screenshot.png", full_page=False)
              browser.close()
          PYEOF

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keepalive-screenshot-${{ github.run_id }}
          path: keepalive_screenshot.png
          retention-days: 7
          if-no-files-found: ignore
