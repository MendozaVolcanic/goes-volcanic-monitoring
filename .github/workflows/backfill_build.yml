name: Backfill historico build

# Manual trigger: corre `scripts/build_backfill.py` con parametros del usuario
# y publica el resultado como release `backfill-<DATE>-<VOLCAN>`. Permite
# revisar eventos historicos (RAMMB archive ~360 dias) en la vista
# "📅 Backfill historico" del dashboard.

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Fecha (YYYY-MM-DD)'
        required: true
        default: '2026-02-08'
      start:
        description: 'Hora inicio UTC (HH:MM)'
        required: true
        default: '10:36'
      end:
        description: 'Hora fin UTC (HH:MM)'
        required: true
        default: '19:00'
      volcan:
        description: 'Nombre del volcan (debe matchear CATALOG)'
        required: true
        default: 'Lascar'
      zone:
        description: 'Zona (norte/centro/sur/austral). Vacio para skip.'
        required: false
        default: 'norte'
      include_volcat:
        description: 'Intentar VOLCAT (puede fallar si no esta en archive SSEC)'
        type: boolean
        default: true
      include_hotspots:
        description: 'Intentar hotspots FDCF historicos (S3 NOAA L2)'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias
        run: pip install -r requirements_actions.txt

      - name: Build backfill
        run: |
          set -e
          ARGS=(
            "--date" "${{ inputs.date }}"
            "--start" "${{ inputs.start }}"
            "--end" "${{ inputs.end }}"
            "--volcan" "${{ inputs.volcan }}"
          )
          if [ -n "${{ inputs.zone }}" ]; then
            ARGS+=("--zone" "${{ inputs.zone }}")
          fi
          if [ "${{ inputs.include_volcat }}" = "true" ]; then
            ARGS+=("--include-volcat")
          fi
          if [ "${{ inputs.include_hotspots }}" = "true" ]; then
            ARGS+=("--include-hotspots")
          fi
          python scripts/build_backfill.py "${ARGS[@]}"

      - name: Listar contenido
        run: |
          ls out_backfill/ | head -20
          echo "---"
          echo "Total assets: $(ls out_backfill/ | wc -l)"
          echo "Total size: $(du -sh out_backfill/ | cut -f1)"

      - name: Publicar al release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # Slug del volcan para el tag (lowercase, alfanumerico)
          VOLC_SLUG=$(echo "${{ inputs.volcan }}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/_/g')
          TAG="backfill-${{ inputs.date }}-${VOLC_SLUG}"
          TITLE="Backfill ${{ inputs.volcan }} ${{ inputs.date }} ${{ inputs.start }}-${{ inputs.end }} UTC"

          # Crear o actualizar release
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TITLE" \
              --notes "Backfill auto-generado por workflow para ${{ inputs.volcan }} ${{ inputs.date }}. Lee desde dashboard view 'Backfill historico'."
          fi

          # Borrar assets viejos (snapshot completo cada vez)
          gh release view "$TAG" --json assets --jq '.assets[].name' \
            | while read -r asset; do
                gh release delete-asset "$TAG" "$asset" --yes 2>/dev/null || true
              done

          # Subir en batches de 50 con 30s sleep entre — evita rate limit
          # secundario de GitHub (~5000 req/h pero hay sub-quotas en uploads).
          BATCH_SIZE=50
          ALL_FILES=(out_backfill/*)
          TOTAL=${#ALL_FILES[@]}
          echo "Subiendo $TOTAL assets en batches de $BATCH_SIZE..."
          for ((i=0; i<TOTAL; i+=BATCH_SIZE)); do
            BATCH=("${ALL_FILES[@]:i:BATCH_SIZE}")
            echo "  Batch $((i/BATCH_SIZE + 1)): ${#BATCH[@]} files"
            gh release upload "$TAG" "${BATCH[@]}" --clobber
            if (( i + BATCH_SIZE < TOTAL )); then
              echo "  Sleeping 30s para evitar rate limit..."
              sleep 30
            fi
          done
          echo "Listo. Tag: $TAG"
