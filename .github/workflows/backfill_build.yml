name: Backfill historico build

# Manual trigger: corre `scripts/build_backfill.py` con parametros del usuario
# y publica el resultado como release `backfill-<DATE>-<VOLCAN>`. Permite
# revisar eventos historicos (RAMMB archive ~360 dias) en la vista
# "📅 Backfill historico" del dashboard.

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Fecha (YYYY-MM-DD)'
        required: true
        default: '2026-02-08'
      start:
        description: 'Hora inicio UTC (HH:MM)'
        required: true
        default: '10:36'
      end:
        description: 'Hora fin UTC (HH:MM)'
        required: true
        default: '19:00'
      volcan:
        description: 'Nombre del volcan (debe matchear CATALOG)'
        required: true
        default: 'Lascar'
      zone:
        description: 'Zona (norte/centro/sur/austral). Vacio para skip.'
        required: false
        default: 'norte'
      include_volcat:
        description: 'Intentar VOLCAT (puede fallar si no esta en archive SSEC)'
        type: boolean
        default: true
      include_hotspots:
        description: 'Intentar hotspots FDCF historicos (S3 NOAA L2)'
        type: boolean
        default: true

# El tag es dinamico (`backfill-<fecha>-<volcan>`), asi que dos runs solo se
# pisan si alguien pide a mano la MISMA fecha y el MISMO volcan — no es la
# carrera cron-vs-manual que le paso a `hires-loop-rolling`. Pero cuando pasa,
# pasa igual: la accion publica un snapshot completo del release, y dos runs
# concurrentes sobre el mismo tag se borran los assets entre si. El grupo se
# arma con los mismos inputs que forman el tag, para no serializar backfills de
# eventos distintos, que es el caso normal.
#
# Limite conocido: el tag slugifica el nombre (`tr '[:upper:]' '[:lower:]'` +
# no-alfanumerico -> `_`) y el grupo usa el input CRUDO, porque las expresiones
# de `concurrency` se evaluan antes de que corra ningun shell y no hay forma de
# normalizar ahi. Dos grafias que slugifiquen igual —"Nevados de Chillan" y
# "Nevados-de-Chillan"— darian el MISMO tag con grupos distintos, o sea la
# carrera que esto viene a evitar. Requiere que alguien escriba el mismo volcan
# de dos formas dentro de la misma ventana de ejecucion; si algun dia pasa, la
# salida es un input de tipo `choice` con los nombres del CATALOG.
concurrency:
  group: backfill-${{ inputs.date }}-${{ inputs.volcan }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias
        run: pip install -r requirements_actions.txt

      - name: Build backfill
        run: |
          set -e
          ARGS=(
            "--date" "${{ inputs.date }}"
            "--start" "${{ inputs.start }}"
            "--end" "${{ inputs.end }}"
            "--volcan" "${{ inputs.volcan }}"
          )
          if [ -n "${{ inputs.zone }}" ]; then
            ARGS+=("--zone" "${{ inputs.zone }}")
          fi
          if [ "${{ inputs.include_volcat }}" = "true" ]; then
            ARGS+=("--include-volcat")
          fi
          if [ "${{ inputs.include_hotspots }}" = "true" ]; then
            ARGS+=("--include-hotspots")
          fi
          python scripts/build_backfill.py "${ARGS[@]}"

      - name: Listar contenido
        run: |
          ls out_backfill/ | head -20
          echo "---"
          echo "Total assets: $(ls out_backfill/ | wc -l)"
          echo "Total size: $(du -sh out_backfill/ | cut -f1)"

      - name: Calcular tag y title (deps de inputs)
        id: meta
        run: |
          VOLC_SLUG=$(echo "${{ inputs.volcan }}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/_/g')
          echo "tag=backfill-${{ inputs.date }}-${VOLC_SLUG}" >> "$GITHUB_OUTPUT"
          echo "title=Backfill ${{ inputs.volcan }} ${{ inputs.date }} ${{ inputs.start }}-${{ inputs.end }} UTC" >> "$GITHUB_OUTPUT"

      - name: Publicar al release
        uses: ./.github/actions/gh-release-snapshot
        with:
          tag: ${{ steps.meta.outputs.tag }}
          title: ${{ steps.meta.outputs.title }}
          notes: "Backfill auto-generado por workflow para ${{ inputs.volcan }} ${{ inputs.date }}. Lee desde dashboard view 'Backfill historico'."
          dir: out_backfill
          prerelease: 'false'
          # batch chico + sleep para evitar el 401/403 de secondary rate-limit
          # que cortó el upload del primer intento (~32 assets in). (jun 2026)
          batch-size: '20'
          sleep-between-batches: '25'
